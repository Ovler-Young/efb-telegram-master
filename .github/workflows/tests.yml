name: Tests

on:
  push:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
      - 'README.rst'
      - 'readme_translations/**.rst'
      - 'dodo.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/tests.yml'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
      - 'README.rst'
      - 'readme_translations/**.rst'
      - 'dodo.py'
      - '.pre-commit-config.yaml'
      - '.github/workflows/tests.yml'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync --locked --extra tests --extra tgs
    - name: Install binary dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg libmagic-dev libwebp-dev
    - name: Run quality checks
      run: |
        uv run --locked doit quality
    - name: Test unit suite
      run: |
        uv run --locked pytest -vv -r a -l --color=yes --mode=unit

  integration:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    environment: telegram-integration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: efb_telegram
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d efb_telegram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv sync --locked --extra tests --extra tgs --extra postgresql
    - name: Install binary dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg libmagic-dev libwebp-dev
    - name: Test integration suite
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        ADMINS: ${{ secrets.TELEGRAM_ADMINS }}
        GROUPS: ${{ secrets.TELEGRAM_GROUPS }}
        CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
        TOPIC_GROUP: ${{ secrets.TELEGRAM_TOPIC_GROUP }}
        AUX_BOT_TOKEN: ${{ secrets.TELEGRAM_AUX_BOT_TOKEN }}
        AUX_BOT_TOKEN_2: ${{ secrets.TELEGRAM_AUX_BOT_TOKEN_2 }}
        USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        API_ID: ${{ secrets.TELEGRAM_API_ID }}
        API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TEST_POSTGRES_HOST: 127.0.0.1
        TEST_POSTGRES_PORT: "5432"
        TEST_POSTGRES_DB: efb_telegram
        TEST_POSTGRES_USER: postgres
        TEST_POSTGRES_PASSWORD: postgres
      run: |
        uv run --locked pytest -vv -r a -l --color=yes --mode=integration
