name: Tests

on:
  push:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
  pull_request:
    paths:
      - 'efb_telegram_master/**.py'
      - 'tests/**.py'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      run_postgres_tests:
        description: "Run optional PostgreSQL-backed test job"
        required: false
        default: false
        type: boolean

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[tests,tgs]'
        mypy --install-types --non-interactive -p efb_telegram_master
    - name: Install binary dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg libmagic-dev libwebp-dev
    - name: Check with mypy
      run: |
        mypy -p efb_telegram_master --ignore-missing-imports
    - name: Test with pytest on commits
      if: ${{ github.event_name == 'push' }}
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        ADMINS: ${{ secrets.TELEGRAM_ADMINS }}
        GROUPS: ${{ secrets.TELEGRAM_GROUPS }}
        CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
        TOPIC_GROUP: ${{ secrets.TELEGRAM_TOPIC_GROUP }}
        AUX_BOT_TOKEN: ${{ secrets.TELEGRAM_AUX_BOT_TOKEN }}
        AUX_BOT_TOKEN_2: ${{ secrets.TELEGRAM_AUX_BOT_TOKEN_2 }}
        USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        API_ID: ${{ secrets.TELEGRAM_API_ID }}
        API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      run: |
        pytest -vv -r a -l --color=yes
    - name: Test with pytest on pull requests
      if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        ADMINS: ${{ secrets.TELEGRAM_ADMINS }}
        GROUPS: ${{ secrets.TELEGRAM_GROUPS }}
        CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
        TOPIC_GROUP: ${{ secrets.TELEGRAM_TOPIC_GROUP }}
        AUX_BOT_TOKEN: ${{ secrets.TELEGRAM_AUX_BOT_TOKEN }}
        AUX_BOT_TOKEN_2: ${{ secrets.TELEGRAM_AUX_BOT_TOKEN_2 }}
        USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
        API_ID: ${{ secrets.TELEGRAM_API_ID }}
        API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      run: |
        pytest -vv -r a -l --color=yes --mode=both

  postgres-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_postgres_tests }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: efb_telegram
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d efb_telegram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v1
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[tests,tgs]'
    - name: Install binary dependencies
      run: |
        sudo apt update
        sudo apt install -y ffmpeg libmagic-dev libwebp-dev
    - name: Run PostgreSQL-focused tests
      env:
        TEST_POSTGRES_HOST: 127.0.0.1
        TEST_POSTGRES_PORT: "5432"
        TEST_POSTGRES_DB: efb_telegram
        TEST_POSTGRES_USER: postgres
        TEST_POSTGRES_PASSWORD: postgres
      run: |
        pytest -vv -r a -l --color=yes --mode=unit tests/unit/test_db_migrations.py
